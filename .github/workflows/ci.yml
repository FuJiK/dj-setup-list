name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DjSetupList.sln

      - name: Build
        run: dotnet build DjSetupList.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/DjSetupList.Tests/DjSetupList.Tests.csproj --configuration Release --no-build --verbosity normal
